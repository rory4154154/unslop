<title>Product Redline</title>
<!-- Set the title to "<Product> Redline". Fill GUIDE, PAGES and FILMS in the script at the bottom; nothing else needs editing.
     Layout: full screens first with a drag-to-compare slider, then each component as a step film with a clickable step list. -->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
/* Layout: a designer's bench. Grey work surface, white plates; full screens first, then each component as a step-by-step film. */
:root {
  --surface: #E9EAEC;
  --plate: #FFFFFF;
  --ink: #141525;
  --ink-2: #4A4D5C;
  --ink-3: #6E7180;
  --rule: rgba(20, 21, 37, 0.1);
  --redline: #E5484D;
  --fix: #0B8F7E;
  --fix-wash: #E1F5F1;
  --shot-edge: rgba(0, 0, 0, 0.1);
  --display: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --body: 'DM Sans', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #111216; --plate: #1B1C22; --ink: #ECEDF2; --ink-2: #B7BAC6; --ink-3: #9396A3;
    --rule: rgba(255, 255, 255, 0.1); --redline: #FF6B70; --fix: #3DD6C1; --fix-wash: rgba(61, 214, 193, 0.13);
    --shot-edge: rgba(255, 255, 255, 0.1); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface: #111216; --plate: #1B1C22; --ink: #ECEDF2; --ink-2: #B7BAC6; --ink-3: #9396A3;
  --rule: rgba(255, 255, 255, 0.1); --redline: #FF6B70; --fix: #3DD6C1; --fix-wash: rgba(61, 214, 193, 0.13);
  --shot-edge: rgba(255, 255, 255, 0.1); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface); color: var(--ink);
  font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
.sheet { max-width: 1180px; margin: 0 auto; }
img, video { display: block; max-width: 100%; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0.02em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fix); outline-offset: 2px; }

/* masthead */
.mast { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 48px; align-items: end; padding-block: 56px 16px; }
.slug { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-3); text-transform: uppercase; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 8vw, 88px); line-height: 0.92; letter-spacing: -0.045em; margin: 18px 0 0; text-wrap: balance; }
.lede { max-width: 640px; color: var(--ink-2); font-size: 17px; margin: 20px 0 0; text-wrap: pretty; }
.facts { display: grid; gap: 4px; min-width: 220px; }
.facts div { display: flex; justify-content: space-between; gap: 24px; padding: 4px 0; font-size: 14px; color: var(--ink-2); }
.facts b { font-family: var(--mono); font-weight: 600; color: var(--ink); font-size: 13px; }

.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; padding-block: 44px 18px; flex-wrap: wrap; }
.sec-h h2 { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: -0.03em; margin: 0; }
.sec-h p { margin: 0; color: var(--ink-3); font-size: 14px; }

/* full screens */
.tabs { display: flex; gap: 4px; background: var(--plate); padding: 4px; border-radius: 12px; box-shadow: 0 0 0 1px var(--rule); width: fit-content; max-width: 100%; overflow-x: auto; }
.tabs button { font-size: 14px; font-weight: 500; color: var(--ink-2); background: none; border: 0; border-radius: 9px; padding: 8px 14px; cursor: pointer; white-space: nowrap; transition: background-color 150ms ease-out, color 150ms ease-out; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--plate); }
.page-wrap { background: var(--plate); border-radius: 18px; padding: 20px; margin-top: 14px; box-shadow: 0 0 0 1px var(--rule); }
.cmp { position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--shot-edge); aspect-ratio: 1440 / 800; max-width: 100%; user-select: none; background: #fff; touch-action: pan-y; }
.cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cmp .before { clip-path: inset(0 calc(100% - var(--pos, 50%)) 0 0); }
.cmp .handle { position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 2px; background: #141525; transform: translateX(-1px); pointer-events: none; }
.cmp .handle::after { content: "⇆"; position: absolute; top: 50%; left: 50%; width: 38px; height: 38px; transform: translate(-50%, -50%); border-radius: 50%; background: #141525; color: #fff; display: grid; place-items: center; font-size: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.cmp input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.cmp input:focus-visible + .handle::after { outline: 3px solid var(--fix); outline-offset: 2px; }
.cmp .lab { position: absolute; top: 12px; font: 600 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: #fff; padding: 6px 9px; border-radius: 6px; pointer-events: none; }
.cmp .lab.b { left: 12px; background: var(--redline); }
.cmp .lab.a { right: 12px; background: #0B8F7E; }
.page-notes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 20px; }
.page-notes div { font-size: 14px; color: var(--ink-2); }
.page-notes b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }

/* component films */
.film { background: var(--plate); border-radius: 18px; padding: 22px; margin-bottom: 16px; box-shadow: 0 0 0 1px var(--rule); display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.film video { width: 100%; height: auto; aspect-ratio: 16 / 10; border-radius: 12px; background: #ECEDEF; box-shadow: 0 0 0 1px var(--shot-edge); }
.film .meta { padding-top: 4px; min-width: 0; }
.film .idx { color: var(--ink-3); }
.film h3 { font-family: var(--display); font-size: 24px; font-weight: 600; letter-spacing: -0.025em; margin: 6px 0 4px; line-height: 1.15; text-wrap: balance; }
.film .sub { color: var(--ink-2); margin: 0 0 16px; font-size: 14.5px; text-wrap: pretty; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.steps button { width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 8px 10px 8px 8px; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; cursor: pointer; transition: background-color 160ms ease-out, transform 120ms ease-out; }
.steps button:hover { background: var(--surface); }
.steps button:active { transform: scale(0.99); }
.steps .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 11px/1 var(--mono); color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--rule); transition: background-color 160ms ease-out, color 160ms ease-out; }
.steps b { display: block; font-weight: 600; font-size: 14px; color: var(--ink); }
.steps span.d { display: block; font-size: 13px; color: var(--ink-3); line-height: 1.45; margin-top: 1px; }
.steps li.now button { background: var(--fix-wash); }
.steps li.now .n { background: var(--fix); color: #fff; box-shadow: none; }

.colophon { margin-top: 64px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px 48px; color: var(--ink-3); font-size: 13.5px; }
.colophon ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.colophon b { color: var(--ink-2); font-weight: 600; }

@media (max-width: 860px) {
  .mast, .colophon { grid-template-columns: minmax(0, 1fr); }
  .film { grid-template-columns: minmax(0, 1fr); padding: 14px; }
  .page-notes { grid-template-columns: minmax(0, 1fr); }
  .page-wrap { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="sheet">
  <header class="mast">
    <div>
      <div class="slug mono" id="slug"></div>
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="facts" id="facts"></div>
  </header>

  <div class="sec-h"><h2>Full screens</h2><p>Drag across a screen to compare. Left is the real app.</p></div>
  <div class="tabs" role="tablist" id="tabs" aria-label="Screens"></div>
  <div class="page-wrap">
    <div class="cmp" id="cmp" style="--pos:50%">
      <img class="after" id="imgA" alt="" width="1440" height="800">
      <img class="before" id="imgB" alt="" width="1440" height="800">
      <span class="lab b">Before</span><span class="lab a">After</span>
      <input type="range" id="slider" min="0" max="100" value="50" aria-label="Compare before and after">
      <span class="handle"></span>
    </div>
    <div class="page-notes" id="pageNotes" aria-live="polite"></div>
  </div>

  <div class="sec-h"><h2>Components, step by step</h2><p>Click a step to jump the film to it.</p></div>
  <div id="films"></div>

  <footer class="colophon">
    <div><b>How this was made</b></div>
    <ul id="colophon"></ul>
  </footer>
</div>

<script>
// ---- fill these in ----------------------------------------------------------------------------
const GUIDE = {
  key: 'product-redline',                       // localStorage key for the remembered tab
  product: 'Product',
  slug: ['Product web app', 'Unslop pass', 'Recorded <date from the recording>'],   // the date comes from the recording, never guessed
  lede: 'The Product workspace, cleaned up. The full screens come first: drag across to compare the real app with the rebuild. Below them, each component is a short film that applies the fixes one step at a time.',
  colophon: [
    'Every full-screen "before" is a frame from the original screen recording. Component films start from a rebuild matched to the recording. Every "after" is a static HTML rebuild in Product\u2019s own typeface and brand colour, using only data visible in the recording.',
    'Skills used: unslop by Damir Sokolovsky (@heydamir), unslop-ui, Gesso\u2019s anti-slop detector, Taste Skill\u2019s app-screen inspector, interface-design and its deslop pass, Emil Kowalski\u2019s design engineering, Vercel\u2019s Web Interface Guidelines and ThinkUI\u2019s finish gate. <say what passed>',
    'The step-by-step films use the step morph technique from unslop by Damir Sokolovsky (@heydamir), licensed CC BY 4.0.',
    '<name any change that is a product call, not a visual one, so the team can push back>',
  ],
};
// key = the before/after file stem (img/page-<key>-before.jpg). Three notes per page: what leads, what went, what replaced it.
const PAGES = [
  { key: '1-home', name: 'Home', notes: [['Focal point', '…'], ['No lines', '…'], ['Numbers', '…']] },
];
// id = the film file name (vid/<id>.mp4). One [heading, line] per step, in the same order as Steps.init in the film.
const FILMS = [
  { id: 'rail', title: 'Project icons', sub: 'One line on what the film changes.', steps: [
    ['Kill the glow', 'What changed, in one sentence.']] },
];
// -----------------------------------------------------------------------------------------------

document.getElementById('slug').innerHTML = GUIDE.slug.map((t) => `<span>${t}</span>`).join('');
document.getElementById('title').textContent = `${GUIDE.product}, redlined`;
document.getElementById('lede').textContent = GUIDE.lede;
document.getElementById('facts').innerHTML = [['Full screens', PAGES.length], ['Component films', FILMS.length], ['Steps shown', FILMS.reduce((n, f) => n + f.steps.length, 0)]]
  .map(([k, v]) => `<div>${k} <b>${v}</b></div>`).join('');
document.getElementById('colophon').innerHTML = GUIDE.colophon.map((t) => `<li>${t}</li>`).join('');

// Step timing matches the film engine (engine/steps.js T): 1.1s intro, then 3.7s per step; jump to just before each step's highlight lands.
const INTRO = 1.1, STEP = 3.7, LEAD = 0.6;
const host = document.getElementById('films');
host.innerHTML = FILMS.map((f, i) => `
  <article class="film" id="f-${f.id}">
    <video id="v-${f.id}" src="vid/${f.id}.mp4" poster="vid/${f.id}-poster.jpg" muted playsinline loop controls preload="metadata" width="1600" height="1000" aria-label="${f.title}: before and after, step by step"></video>
    <div class="meta">
      <div class="idx mono">${String(i + 1).padStart(2, '0')} / ${String(FILMS.length).padStart(2, '0')}</div>
      <h3>${f.title}</h3>
      <p class="sub">${f.sub}</p>
      <ol class="steps">${f.steps.map(([h, d], k) => `<li data-k="${k}"><button type="button" data-film="${f.id}" data-k="${k}"><span class="n">${k + 1}</span><span><b>${h}</b><span class="d">${d}</span></span></button></li>`).join('')}</ol>
    </div>
  </article>`).join('');

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
FILMS.forEach((f) => {
  const v = document.getElementById('v-' + f.id);
  const items = [...document.querySelectorAll(`#f-${f.id} .steps li`)];
  v.addEventListener('timeupdate', () => {
    const k = Math.floor((v.currentTime - INTRO + LEAD) / STEP);
    items.forEach((li, j) => li.classList.toggle('now', j === k && v.currentTime > INTRO - LEAD));
  });
});
host.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-film]');
  if (!b) return;
  const v = document.getElementById('v-' + b.dataset.film);
  v.currentTime = Math.max(0, INTRO + Number(b.dataset.k) * STEP - LEAD);
  v.play().catch(() => {});
});
if (!reduce && 'IntersectionObserver' in window) {
  const io = new IntersectionObserver((entries) => entries.forEach((en) => {
    if (en.isIntersecting) en.target.play().catch(() => {}); else en.target.pause();
  }), { threshold: 0.6 });
  document.querySelectorAll('.film video').forEach((v) => io.observe(v));
}

const tabs = document.getElementById('tabs');
const cmp = document.getElementById('cmp');
const slider = document.getElementById('slider');
function showPage(i) {
  const p = PAGES[i];
  const a = document.getElementById('imgA'), b = document.getElementById('imgB');
  a.src = `img/page-${p.key}-after.jpg`; a.alt = `${p.name}, after`;
  b.src = `img/page-${p.key}-before.jpg`; b.alt = `${p.name}, before`;
  document.getElementById('pageNotes').innerHTML = p.notes.map(([h, t]) => `<div><b>${h}</b>${t}</div>`).join('');
  tabs.querySelectorAll('button').forEach((btn, j) => btn.setAttribute('aria-selected', j === i ? 'true' : 'false'));
  try { localStorage.setItem(GUIDE.key, String(i)); } catch (e) {}
}
tabs.innerHTML = PAGES.map((p) => `<button type="button" role="tab" aria-selected="false">${p.name}</button>`).join('');
tabs.querySelectorAll('button').forEach((b, i) => b.addEventListener('click', () => showPage(i)));
slider.addEventListener('input', () => cmp.style.setProperty('--pos', slider.value + '%'));
let start = 0;
try { start = Math.min(PAGES.length - 1, Math.max(0, parseInt(localStorage.getItem(GUIDE.key) || '0', 10) || 0)); } catch (e) {}
showPage(start);
</script>
