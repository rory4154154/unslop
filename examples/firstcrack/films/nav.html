<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sidebar</title>
<link rel="stylesheet" href="frame.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
.plate { width: 392px; height: 612px; }
html.live .plate { transition: height 650ms cubic-bezier(0.3, 1.1, 0.45, 1); }
.stage { zoom: 1.35; width: 290px; height: 453px; padding: 16px 14px; background: #fff; overflow: hidden; }
.s1 .stage { background: var(--shell); }
.s3 .stage { font-family: 'Instrument Sans', sans-serif; }
.s5 .plate { height: 343px; }
.s5 .stage { height: 254px; }

/* logo */
.logo { display: flex; align-items: center; gap: 10px; padding: 0 6px; margin-bottom: 10px; }
.sq { position: relative; width: 32px; height: 32px; border-radius: 10px; background: var(--fc-ink); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(124,58,237,.4); }
.sq::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(135deg, #6366F1, #A855F7); transition: opacity 700ms ease; }
.s1 .sq { box-shadow: none; width: 26px; height: 26px; border-radius: 8px; }
.s1 .sq::before { opacity: 0; }
.ic { position: relative; width: 18px; height: 18px; flex: none; }
.ic > * { position: absolute; inset: 0; display: grid; place-items: center; transition: opacity 500ms ease, transform 600ms cubic-bezier(0.3, 1.1, 0.45, 1) !important; }
.ic .em { font-size: 16px; line-height: 1; }
.ic .ln { opacity: 0; transform: scale(.5) rotate(-20deg); }
.ic .ln svg { width: 16px; height: 16px; stroke-width: 1.7; }
.s2 .ic .em { opacity: 0; transform: scale(.5) rotate(20deg); }
.s2 .ic .ln { opacity: 1; transform: none; }
.sq .ic { z-index: 1; } .sq .ic .ln { color: #fff; }
.sq .ic .ln svg { width: 15px; height: 15px; }
.nm { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(90deg, #4F46E5, #9333EA); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
.s1 .nm { color: var(--fc-ink); }
.s3 .nm { font-size: 15px; font-weight: 500; letter-spacing: 0; }
.badge { font-size: 10px; font-weight: 700; color: #fff; background: linear-gradient(90deg, #EC4899, #8B5CF6); border-radius: 9px; padding: 2px 7px; }

/* sections and items */
.sec { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; color: #9CA3AF; padding: 10px 10px 6px; }
.it { position: relative; display: flex; align-items: center; gap: 11px; height: 36px; padding: 0 10px; border-radius: 11px; font-weight: 500; font-size: 14px; color: #4B5563; margin-bottom: 2px; white-space: nowrap; }
.s3 .it { height: 34px; border-radius: 8px; color: var(--fc-ink-2); font-size: 14px; }
.it .ic .ln { color: var(--fc-ink-3); }
.it.on { color: #fff; font-weight: 600; box-shadow: 0 8px 18px rgba(99,102,241,.35); }
.it.on::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, #6366F1, #8B5CF6); transition: opacity 700ms ease; }
.it.on > * { position: relative; }
.s1 .it.on { background: var(--fill-2); color: var(--fc-ink); box-shadow: none; }
.s1 .it.on::before { opacity: 0; }
.s3 .it.on { font-weight: 500; }
.it.on .ic .ln { color: var(--fc-ink); }
.ct { margin-left: auto; font-size: 11px; font-weight: 700; background: #EEF2FF; color: #4F46E5; border-radius: 9px; padding: 2px 8px; }
.s4 .ct { background: transparent; color: var(--fc-ink-3); font-weight: 400; font-family: var(--mono); font-size: 12px; padding: 2px 0; }
.nw { margin-left: auto; font-size: 10px; font-weight: 700; color: #fff; background: linear-gradient(90deg, #F59E0B, #EF4444); border-radius: 9px; padding: 2px 7px; }

/* upsell */
.up { margin-top: 12px; border-radius: 14px; padding: 14px; color: #fff; background: linear-gradient(135deg, #6366F1 0%, #A855F7 60%, #EC4899 100%); box-shadow: 0 10px 26px rgba(139,92,246,.35); }
.up b { display: block; font-size: 14px; font-weight: 700; margin-bottom: 3px; }
.up p { font-size: 12px; opacity: .9; line-height: 1.4; }
.up .btn { margin-top: 10px; background: #fff; color: #6D28D9; border-radius: 9px; padding: 7px; text-align: center; font-weight: 700; font-size: 12.5px; }
</style></head>
<body>
<div class="frame">
  <div class="cap"><div><div class="k">Firstcrack · unslop</div><h1>Sidebar</h1></div><span class="count" data-counter>Before</span></div>
  <div class="plate"><div class="stage slop">
    <div class="logo" id="logo">
      <div class="sq"><span class="ic"><span class="em">☕</span><span class="ln"><i data-lucide="bean"></i></span></span></div>
      <span class="nm">Firstcrack</span><span data-out="4" data-axis="x"><span class="badge" id="ai">AI</span></span>
    </div>
    <div class="sec" id="sec1" data-out="3">MAIN MENU</div>
    <div class="navs" id="navs">
      <div class="it on" id="active"><span class="ic"><span class="em">🏠</span><span class="ln"><i data-lucide="house"></i></span></span><span class="swap" data-at="3"><span class="from">Dashboard</span><span class="to">Today</span></span></div>
      <div class="it"><span class="ic"><span class="em">🔥</span><span class="ln"><i data-lucide="flame"></i></span></span><span class="swap" data-at="3"><span class="from">Roast Schedule</span><span class="to">Roasts</span></span></div>
      <div class="it"><span class="ic"><span class="em">📦</span><span class="ln"><i data-lucide="package"></i></span></span>Orders<span class="ct" id="ct">12</span></div>
      <div class="it"><span class="ic"><span class="em">🌱</span><span class="ln"><i data-lucide="bean"></i></span></span><span class="swap" data-at="3"><span class="from">Green Coffee</span><span class="to">Green coffee</span></span></div>
      <div class="sec" id="sec2" data-out="3">INSIGHTS</div>
      <div class="it"><span class="ic"><span class="em">🤖</span><span class="ln"><i data-lucide="message-square"></i></span></span><span class="swap" data-at="4"><span class="from">AI Assistant</span><span class="to">Assistant</span></span><span data-out="4" data-axis="x" style="margin-left:auto"><span class="nw" id="new">New ✨</span></span></div>
    </div>
    <div class="up" id="up" data-out="5"><b>Upgrade to Pro 🚀</b><p>Unlock AI-powered roast analytics and unlimited batches!</p><div class="btn">Upgrade Now ✨</div></div>
  </div></div>
</div>
<script src="steps.js"></script>
<script>
lucide.createIcons();
Steps.init({ steps: [
  { label: 'Kill the gradients', target: ['#logo', '#active'], hit: '#active' },
  { label: 'Real icons, not emoji', target: ['#navs'], hit: '#active .ic' },
  { label: 'Drop the labels, calm the type', target: ['#sec1', '#sec2'], hit: '#sec1' },
  { label: 'Badges go quiet', target: ['#ai', '#ct', '#new'], hit: '#new' },
  { label: 'No upsell in the nav', target: ['#up'] },
] });
</script>
</body></html>
